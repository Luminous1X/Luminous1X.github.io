<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Luminous1X</title>
		<meta name="description" content="Luminous1X: about me, projects and links." />
		<meta name="theme-color" content="#030308" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600&family=Silkscreen&family=VT323&display=swap"
		/>
		<link rel="stylesheet" href="style.css" />
		<script src="content.js" defer></script>
		<script src="glyphs.js" defer></script>
		<script src="main.js" defer></script>
	</head>
	<body>
		<canvas id="sky" aria-hidden="true"></canvas>

		<main id="stage">
			<nav id="orbit" aria-label="Sections and links"></nav>
			<div id="icon" aria-hidden="true">
				<div class="halo"></div>
				<div class="pixels"></div>
				<div class="glints"></div>
			</div>
			<header id="title">
				<h1 id="name"></h1>
				<p id="tagline"></p>
				<p id="hint"></p>
			</header>
		</main>

		<div class="crt" aria-hidden="true"></div>

		<dialog id="window" aria-labelledby="window-title">
			<div class="frame">
				<header class="bar">
					<span class="bar-glyph" aria-hidden="true"></span>
					<h2 id="window-title"></h2>
					<button class="close" type="button" aria-label="Close window">ESC</button>
				</header>
				<div class="body" id="window-body"></div>
			</div>
		</dialog>

		<noscript>
			<p class="noscript">
				This page draws its stars with JavaScript. Turn it on to see them, or find me at
				<a href="https://github.com/Luminous1X">github.com/Luminous1X</a>.
			</p>
		</noscript>
	</body>
</html>
